<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Dashboard</title>
<style>

    font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 20px 72px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; margin-bottom: 24px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -.01em; }
  .question { color: var(--muted); margin: 2px 0 0; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--ink2); margin: 0 0 20px; font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px; margin-bottom: 20px; }

  .verdict { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; padding: 0; overflow: hidden; }
  .tile { padding: 28px; border-left: 1px solid var(--line); min-width: 0; }
  .tile:first-child { border-left: 0; }
  .tile .label { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .tile .big { font-size: 40px; font-weight: 700; line-height: 1.15; letter-spacing: -.02em; margin-top: 6px; white-space: nowrap; }
  .tile .big.word { font-size: 32px; white-space: normal; }
  .tile .detail { color: var(--ink2); margin-top: 4px; }
  .bad { color: var(--accent-ink); }
  .calm { color: var(--ink2); }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft);
    border-radius: 999px; padding: 2px 9px; margin-left: 8px; vertical-align: middle; white-space: nowrap; letter-spacing: 0; text-transform: none; }
  .datanote { font-size: 14px; color: var(--ink2); margin: -8px 4px 20px; }
  .banner { background: var(--accent-soft); border: 1px solid #e3bfae; border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; }

  /* 2. Trend */
  .legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 14px; color: var(--ink2); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  #trendBox { position: relative; }
  #trend { display: block; width: 100%; height: auto; overflow: visible; }
  #trend text { font: 13px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--muted); }
  #trend text.end { fill: var(--ink); font-weight: 600; }
  .tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
    padding: 8px 12px; font-size: 14px; white-space: nowrap; z-index: 5; }
  .tip b { display: block; margin-bottom: 2px; }
  .tip i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }

  /* 3. Bars */
  .barrow { display: grid; grid-template-columns: 190px 1fr 96px 210px; gap: 16px; align-items: center; padding: 9px 6px; border-radius: 8px; cursor: pointer; margin: 0 -6px; }
  .barrow:hover { background: #f1f0eb; }
  .barrow .name { font-weight: 500; }
  .track { height: 14px; }
  .fill { height: 14px; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
  .fill.flag { background: var(--accent); }
  .fill.zero { background: transparent; border-left: 2px solid var(--line); border-radius: 0; }
  .barrow .amt { text-align: right; font-weight: 600; }
  .barrow .chg { font-size: 14px; color: var(--ink2); }
  .hint { font-size: 14px; color: var(--muted); margin-top: 12px; }

  /* 4. Table */
  .filters { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 14px; }
  .filters label { font-size: 15px; color: var(--ink2); }
  .count { margin-left: auto; color: var(--ink2); font-size: 15px; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th button { border: 0; background: none; padding: 0; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; }
  td { padding: 10px 12px 10px 0; border-bottom: 1px solid #eeede8; vertical-align: top; }
  td.r, th.r { text-align: right; padding-right: 20px; }
  td.notes { color: var(--ink2); }
  td.nowrap { white-space: nowrap; }
  .empty { color: var(--muted); padding: 20px 0; }

  body.dragging .wrap { outline: 3px dashed var(--focus); outline-offset: -8px; border-radius: 16px; }
  @media (max-width: 760px) {
    .verdict { grid-template-columns: 1fr; }
    .tile { border-left: 0; border-top: 1px solid var(--line); padding: 20px; }
    .tile:first-child { border-top: 0; }
    .card { padding: 20px; }
    .barrow { grid-template-columns: 1fr auto; gap: 4px 12px; }
    .barrow .track { grid-column: 1 / -1; order: 3; }
    .barrow .chg { grid-column: 1 / -1; order: 4; }
    .count { margin-left: 0; width: 100%; }
  }
  @media print { .tools, .hint { display: none !important; } body { background: #fff; } .card { break-inside: avoid; } }
</style>
</head>

<div class="wrap">
  <header>
    <div>
      <h1>Expense Dashboard</h1>

    </div>

  </header>

  <div id="error" class="banner hidden" role="alert"></div>
  <div id="saved" class="banner hidden" role="status"></div>
  <div id="app"></div>
</div>

    if (!file) return;
    $("error").classList.add("hidden"); $("saved").classList.add("hidden");
    if (/\.(xlsx?|numbers)$/i.test(file.name)) { showError("That looks like a spreadsheet file. Save or export it as CSV first (in Excel: File > Save As > CSV), then load the CSV."); return; }
    var fr = new FileReader();
    fr.onload = function () {
      var keepRows = rows, keepLeft = leftOut;
      try { setData(String(fr.result), file.name); $("save").classList.remove("hidden"); }
      catch (err) {
        rows = keepRows; leftOut = keepLeft;
        showError(err && err.message ? err.message : "Something unexpected went wrong.");
        try { draw(); } catch (e2) {}
      }
    };
    fr.onerror = function () { showError("The file could not be opened."); };
    fr.readAsText(file);
  }
  // Makes a fresh copy of this page with the current data built in.
  function saveCopy() {
    var doc = document.documentElement.cloneNode(true);
    doc.querySelector("#app").innerHTML = "";
    doc.querySelector("#month").innerHTML = "";
    doc.querySelector("#save").classList.add("hidden");
    doc.querySelector("#error").classList.add("hidden"); doc.querySelector("#saved").classList.add("hidden");
    doc.querySelector("body").className = "";
    doc.querySelector("title").textContent = "Expense Dashboard";
    doc.querySelector("#embedded").textContent = JSON.stringify({ name: sourceName, csv: sourceText }).replace(/</g, "\\u003c");
    var blob = new Blob(["<!DOCTYPE html>\n" + doc.outerHTML], { type: "text/html" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "index.html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    var s = $("saved"); s.textContent = "A new copy called \"index.html\" was saved to your Downloads folder with " + sourceName +
      " built in. Replace the old index.html with it."; s.classList.remove("hidden");
  }

  $("file").addEventListener("change", function (e) { handle(e.target.files[0]); e.target.value = ""; });
  $("month").addEventListener("change", function (e) { selected = e.target.value; draw(); });
  $("save").addEventListener("click", saveCopy);
  ["dragenter", "dragover"].forEach(function (ev) { window.addEventListener(ev, function (e) { e.preventDefault(); document.body.classList.add("dragging"); }); });
  ["dragleave", "drop"].forEach(function (ev) { window.addEventListener(ev, function (e) { e.preventDefault(); document.body.classList.remove("dragging"); }); });
  window.addEventListener("drop", function (e) { if (e.dataTransfer && e.dataTransfer.files.length) handle(e.dataTransfer.files[0]); });

  try {
    var emb = JSON.parse($("embedded").textContent);
    setData(emb.csv, emb.name);
  } catch (err) {
    var e0 = $("error"); e0.classList.remove("hidden");
    e0.textContent = "The data built into this dashboard could not be read. Use \"Load new file\" to load your expense CSV. (" + (err && err.message) + ")";
  }
})();
</script>
</body>
</html>
